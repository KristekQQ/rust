name: Verify engine
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software-webgl:
    runs-on: ubuntu-latest
    # Trusted loopback fixtures only; the disposable runner is the isolation boundary.
    env:
      BROWSER_CI_NO_SANDBOX: '1'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned toolchain and Clippy
        run: rustup show && rustup component add clippy
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - run: npm ci
      - name: Native, WASM, SDK and software WebGL
        run: npm run verify -- --backend webgl --software
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: software-webgl-report
          path: output/verification/
          if-no-files-found: ignore
