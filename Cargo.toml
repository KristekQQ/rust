[package]
name = "webgpu_wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

# Runtime speed first; production JS/compression is handled separately.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "webgpu", "webgl", "wgsl"] }
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "Window",
    "Document",
    "console",
    "Performance",
    "EventTarget",
    "KeyboardEvent",
    "MouseEvent",
    "PointerEvent"
] }
glam    = { version = "0.34.0", default-features = false, features = ["libm","serde"] }
js-sys = "0.3"
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extras"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

[patch.crates-io]
wgpu = { path = "third_party/wgpu" }
