[package]
name = "neon-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
webgpu_wasm = { path = "../..", default-features = false }
glam = { version = "0.34.0", default-features = false, features = ["libm", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

log = "0.4"

[patch.crates-io]
wgpu = { path = "../../third_party/wgpu" }
