[package]
name = "neon-browser-worker"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
neon-core = { path = "../neon-core" }
webgpu_wasm = { path = "../..", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json = "1.0"
glam = { version = "0.34.0", default-features = false, features = ["libm"] }
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
[patch.crates-io]
wgpu = { path = "../../third_party/wgpu" }
