<!doctype html><html lang="cs"><meta charset="utf-8"><title>Neonová aréna / VR hra</title>
<style>body{background:#101827;color:#eef3ff;font:14px system-ui}#gpu-canvas{width:480px;height:320px}#enter,#exit,#shoot{display:none}pre{white-space:pre-wrap}</style>
<canvas id="gpu-canvas"></canvas><button id="enter"></button><button id="exit" hidden></button><button id="shoot"></button><span id="cuts">0</span><p id="status">Inicializace…</p><pre id="result">RUNNING</pre>
<figure><figcaption>Skutečné obrazy obou očí v simulovaném XR: prostředí a prostorové panely</figcaption><canvas id="stereo" style="width:100%;height:auto"></canvas></figure>
<figure><figcaption>Skutečný zásah: neonový výboj a rozříznuté kusy</figcaption><canvas id="hit" style="width:100%;height:auto"></canvas></figure>
<figure><figcaption>Ovoce fyzicky opřené o plochu meče</figcaption><canvas id="support" style="width:100%;height:auto"></canvas></figure>
<figure><figcaption>Aktuální trojice a předchozí výhra +120</figcaption><canvas id="cut-evidence" style="width:100%;height:auto"></canvas></figure>
<figure><figcaption>Konec kola: skóre a čas uvnitř scény</figcaption><canvas id="score" style="width:100%;height:auto"></canvas></figure><ol id="checks"></ol>
<script type="module">
import {cutFaceColor,FRUIT_POINTS,launchApple,NEON_GLOW,FRUIT_SCALE,RESTART_POSITION,PAYTABLE_YAW,COMBO_DISPLAY_ORIGIN} from '../examples/neon-arena/scene.js';
import {FRUIT_PATTERN_COUNT} from '../examples/neon-arena/geometry.js';
import {installXRSimulator} from './xr/simulator.js';
import {matrixFromPose} from './xr/poses.js';
import {XRTestRun,publishXRReport,pixelDifference} from './xr/testkit.js';
import {assertForeground} from './pixels.js';
// Count the game director separately from the optional 250ms diagnostics sampler.
const sim=installXRSimulator({profile:{eyeWidth:640,eyeHeight:640}});
const run=new XRTestRun('neon-arena-xr',sim,publishXRReport);
const snapshot=id=>{
    const left=sim.pixels('left'),right=sim.pixels('right'),canvas=document.getElementById(id);
    canvas.width=left.width+right.width;canvas.height=left.height;
    const context=canvas.getContext('2d');context.putImageData(left,0,0);context.putImageData(right,left.width,0);
};
const previousPreset=localStorage.getItem('neon-arena.wave-preset.v1');
let app;
const report=await run.execute(async test=>{
    app=await import('../examples/neon-arena/main.js');
    app.arenaTools.call('arena_reset');
    app.engine.xr.configureComboDisplay({...app.world.comboDisplay,mode:'legacy'});
    const {engine,world}=app;
    // Keep legacy cutting/score probes isolated; ten-target coverage lives in arena-waves.
    app.arenaTools.call('arena_configure',{count:1,program:'practice'});
    test.assert(engine.renderer_backend()==='Gl','actual WebGL production arena');
    const reports=[];
    engine.xr.addEventListener('cut',event=>reports.push({...event.detail,info:event.detail.pieces.map(p=>p.meshInfo),colors:event.detail.pieces.map(p=>p.meshSnapshot.colors)}));
    await engine.xr.enter();
    test.assert(app.gameState().shots===1 && sim.timerCountForDelay(100)===1,'VR starts one automatic fruit launch timer');
    test.assert(app.gameState().liveApples[0].meshInfo.scale.every(value=>Math.abs(value-FRUIT_SCALE)<1e-6)&&Math.abs(FRUIT_SCALE-.09)<1e-6,'production fruit uses the larger comfortable gameplay scale');
    const restartPose=world.restartButton.meshInfo.position;
    test.assert(Math.abs(restartPose[0])<.05&&restartPose[2]>.8&&restartPose[2]<1.05&&restartPose[1]>1.05&&restartPose[1]<1.35,'restart is behind the player at chest height within stationary sword reach');
    test.assert(engine.xr.roundState.duration===60,'Rust owns a 60 second round');
    const still={dt:0,head:{position:[0,1.55,0],orientation:[0,0,0,1]},controllers:{
        right:{position:[1.2,1.1,-.2],orientation:[0,0,0,1],pressed:false},
        left:{position:[-1.2,1.1,-.2],orientation:[0,0,0,1],pressed:false}
    }};
    sim.frame(still);
    const fontInitial=engine.debugStats().font3d;
    test.assert(world.arenaFont.selected==='cynatar'&&world.timerPanel.font3DInfo.text==='60'&&world.scorePanel.font3DInfo.text==='0',`default Cynatar binds the existing native timer60 and score0 roots: ${JSON.stringify([world.arenaFont.selected,world.timerPanel.font3DInfo,world.scorePanel.font3DInfo])}`);
    test.assert(fontInitial.runtime.texts===5&&fontInitial.runtime.liveGlyphs===3&&fontInitial.runtime.cachedGlyphs===2&&fontInitial.instanceGeometryBytes===0,'five native font bindings share two glyph assets for three visible instances');
    test.assert(engine.debugStats().numericFont.liveGlyphs===0,'Cynatar bindings release the original numeric tube instances');
    const person=engine.xr.player;
    const initialPerson=person.state;
    test.assert(initialPerson.head.tracked&&Math.abs(initialPerson.head.position[1]-1.55)<1e-5,'generic XRPlayer receives the actual viewer head pose');
    const floorY=world.floorTiles?.meshInfo.position[1]??Infinity;
    test.assert(world.floorTiles?.exists&&world.floorTiles.meshInfo.triangles>0&&floorY<=.001&&world.floorGrout?.exists&&world.floorGrout.meshInfo.position[1]<=-.02&&initialPerson.head.position[1]>floorY+1,'tiled floor and recessed grout exist below the XR player');
    test.assert(initialPerson.leftHand.tracked&&initialPerson.rightHand.tracked,'generic XRPlayer tracks both hands');
    test.assert(initialPerson.inventory.length===2&&initialPerson.rightHand.object.id===world.sword.id&&initialPerson.leftHand.object.id===world.leftSword.id,'arena equips its own swords through generic inventory slots');
    // A non-weapon object must work through the same slot, including unbound tracking.
    const prop=engine.scene.createCube([0,-10000,0]).setScale([.05,.08,.1]);
    person.unequip('right').addItem(prop).equip('right',prop);
    sim.frame(still);
    test.assert(person.rightHand.object.id===prop.id&&person.rightHand.tracked,'generic hand equips an arbitrary non-cutting prop');
    person.removeItem(prop);
    sim.frame(still);
    test.assert(person.rightHand.object===null&&person.rightHand.tracked&&prop.exists,'removal keeps the object alive and hand tracking active without equipment');
    prop.remove();
    person.equip('right',world.sword,{cutting:true,requireTrigger:false,haptics:true});
    sim.frame({...still,head:{tracked:false}});
    test.assert(!person.head.tracked&&!person.leftHand.tracked&&!person.rightHand.tracked,'viewer tracking loss clears generic player poses');
    sim.frame({...still,head:{...still.head,tracked:true}});
    const left=sim.pixels('left'),right=sim.pixels('right');
    assertForeground(left,'arena left');assertForeground(right,'arena right');
    test.assert(pixelDifference(left,right)>20,'separate stereo eye projections');
    // Prove the playable target itself renders; panels alone must never satisfy this check.
    const visibleFruit=app.gameState().liveApples[0],fruitOrigin=visibleFruit.meshInfo.position;
    visibleFruit.setPosition([100,100,100]);sim.frame(still);
    test.assert(pixelDifference(left,sim.pixels('left'),3)>200 && pixelDifference(right,sim.pixels('right'),3)>200,'first playable neon fruit is visible in BOTH eyes immediately on entry');
    const hiddenLeft=sim.pixels('left'),hiddenRight=sim.pixels('right');
    for(const [image,hidden] of [[left,hiddenLeft],[right,hiddenRight]]){
        let red=0,green=0;
        for(let i=0;i<image.data.length;i+=4){
            const [r,g,b]=image.data.slice(i,i+3);
            if(Math.abs(r-hidden.data[i])+Math.abs(g-hidden.data[i+1])+Math.abs(b-hidden.data[i+2])<25)continue;
            if(r>100&&r>g*1.4&&r>b*1.2)red++;
            if(g>100&&g>r*1.4&&g>b*1.2)green++;
        }
        test.assert(red>50&&green>4,'cherries visibly have red/pink berries AND green stalks in each eye', {red,green});
    }
    test.assert(world.fruits.every(f=>{
        const palette=new Set();const colors=f.geometry.triangleColors;
        for(let i=0;i<colors.length;i+=3)if(Math.max(colors[i],colors[i+1],colors[i+2])>.25)palette.add([colors[i],colors[i+1],colors[i+2]].join(','));
        return palette.size>=2;
    }),'every fruit uses at least two distinct neon colors without extra objects');
    visibleFruit.setPosition(fruitOrigin);sim.frame(still);
    test.assert(visibleFruit.meshInfo.closed && fruitOrigin[1]>1.1 && fruitOrigin[2]>-1.5,'first target is a closed solid within hand reach, above the floor');
    test.assert(fruitOrigin[1]>floorY+1,'playable fruit remains above the tiled floor');
    test.assert(['cherry','lime','banana','orange','plum','grapes','watermelon'].every(name=>world.fruits.some(f=>f.name===name)),'all seven Midnight Fruits fruit types exist as distinct neon meshes');
    test.assert(world.playFruits[0].name==='cherry','a new round starts with cherries');
    test.assert(world.playFruits.length===54 && world.playFruits.every((fruit,i)=>i%6===2?fruit.name==='wild':fruit.name===world.playFruits[Math.floor(i/6)*6].name),'each six-target wave offers five matching fruit plus a wildcard');
    test.assert([...world.fruits,world.wild].every(fruit=>{
        const choices=Array.from({length:FRUIT_PATTERN_COUNT},()=>world.nextFruitVariant(fruit));
        return choices.length===15&&new Set(choices.map(choice=>JSON.stringify(choice.geometry.triangleColors))).size===15;
    }),'every kind visits all fifteen distinct cached panel patterns before repeating');
    test.assert(new Set(world.fruits.map(fruit=>FRUIT_POINTS[fruit.name].points)).size===world.fruits.length,'every fruit has a distinct triple reward');
    test.assert(world.comboRules.meshInfo.position[0]<-2.4 && world.comboRules.meshInfo.triangles>20,'triple rules and fruit values belong to the left world panel');
    test.assert(world.galleryRows.every((_,row)=>new Set(world.galleryPatterns.slice(row*3,row*3+3).map(fruit=>JSON.stringify(fruit.geometry.triangleColors))).size===3),'each three-symbol row visibly previews different fill coverage of the same fruit');
    test.assert(world.galleryIcons.length===30 && world.galleryLabels.length===10 && world.galleryFrames.length===10,'each fruit and wild has its own vertical row of three symbols and a reward');
    test.assert(world.galleryRows.every((row,i)=>row.icons.length===3 && row.icons.every((icon,slot)=>{
        const pos=icon.meshInfo.position;
        return Math.abs(pos[1]-row.icons[0].meshInfo.position[1])<1e-5 && (slot===0||pos[2]<row.icons[slot-1].meshInfo.position[2]);
    }) && (i===0||row.icons[0].meshInfo.position[1]<world.galleryRows[i-1].icons[0].meshInfo.position[1])), 'three identical symbols run horizontally in each row, with rows stacked vertically');
    const assertProgress=(name,count)=>{
        test.assert(world.galleryRows.every(row=>row.icons.every((icon,slot)=>{
            const active=row.name===name&&slot<count,info=icon.meshInfo;
            return (active?info.emission>7:info.emission>.6&&info.emission<.7) && Math.abs(info.scale[0]-.073*(active?1.32:1))<1e-5;
        })) && world.galleryRows.every((row,i)=>row.icons.every((_,slot)=>{
            const info=world.galleryEarnedFrames[i*3+slot].meshInfo;
            return row.name===name&&slot<count?info.emission>7:info.emission>.6&&info.emission<.7;
        })),`visible earned slots and golden frames: ${name||'none'} ${count}/3`);
    };
    assertProgress('',0);
    test.assert(world.boardTilt<-.25 && world.galleryFrames.every(frame=>Math.abs(frame.meshInfo.rotation[0]-world.boardTilt)<1e-5), 'reward board and row frames tilt toward the player as a single plane');
    test.assert(world.galleryPositions[0][0]<world.galleryPositions[27][0]-.5 && world.galleryLabels.every(label=>Math.abs(label.meshInfo.rotation[0]-world.boardTilt)<1e-5), 'top edge leans away while the lower edge and aligned labels face upward');
    test.assert(world.galleryEarnedFrames.length===30,'every earned fruit slot has a separate golden frame');
    const galleryPose=world.galleryIcons[0].meshInfo.rotation;
    sim.frame({...still,dt:250});
    test.assert(world.galleryIcons[0].meshInfo.rotation.some((v,i)=>Math.abs(v-galleryPose[i])>.01),'gallery fruit rotates through the Rust simulation');
    const frontGalleryLeft=sim.pixels('left'),frontGalleryRight=sim.pixels('right');
    const leftLook={...still,head:{position:[0,1.55,0],orientation:[0,Math.SQRT1_2,0,Math.SQRT1_2]}};
    test.assert(world.galleryIcons.every(icon=>icon.meshInfo.position[0]<-2.4)&&world.galleryFrames.every(frame=>Math.abs(frame.meshInfo.rotation[1]-PAYTABLE_YAW)<1e-5),'paytable is left of the player, facing their leftward view');
    sim.frame(leftLook);
    const galleryLeft=sim.pixels('left'),galleryRight=sim.pixels('right');
    const galleryOrigins=world.galleryIcons.map(icon=>icon.meshInfo.position);
    world.galleryIcons.forEach(icon=>icon.setPosition([100,100,100]));sim.frame(leftLook);
    test.assert(pixelDifference(galleryLeft,sim.pixels('left'),3)>150 && pixelDifference(galleryRight,sim.pixels('right'),3)>150,'turning left reveals rotating reward fruit in BOTH eyes');
    sim.frame(still);
    test.assert(pixelDifference(frontGalleryLeft,sim.pixels('left'),3)<20&&pixelDifference(frontGalleryRight,sim.pixels('right'),3)<20,'paytable fruit stays outside the forward field of view');
    world.galleryIcons.forEach((icon,i)=>icon.setPosition(galleryOrigins[i]));sim.frame(still);
    // Isolate subsequent physics/score cases from the production launch timer.
    app.stopLaunches();
    // Enlarge only this controlled interior probe so the rear surface stays beyond XR near clipping.
    visibleFruit.setScale([.30,.30,.30]);
    const inside={...still,head:{position:[fruitOrigin[0]+.49*.30,fruitOrigin[1]-.32*.30,fruitOrigin[2]]}};
    sim.frame(inside);const innerLeft=sim.pixels('left'),innerRight=sim.pixels('right');
    visibleFruit.setPosition([100,100,100]);sim.frame(inside);
    test.assert(pixelDifference(innerLeft,sim.pixels('left'),3)>100 && pixelDifference(innerRight,sim.pixels('right'),3)>100,'transparent mesh retains visible rear-facing seams in both eyes');
    visibleFruit.setScale([FRUIT_SCALE,FRUIT_SCALE,FRUIT_SCALE]).setPosition(fruitOrigin);sim.frame(still);
    snapshot('stereo');
    const clockText=world.timerPanel.font3DInfo.text,clockBefore=engine.xr.roundState.remaining;
    const fontBeforeTick=engine.debugStats().font3d.runtime;
    sim.frame({...still,dt:1000});
    test.assert(Math.abs(engine.xr.roundState.remaining-(clockBefore-1))<.001&&world.timerPanel.font3DInfo.text===String(Math.ceil(engine.xr.roundState.remaining))&&clockText!==world.timerPanel.font3DInfo.text,'one elapsed second updates the native Cynatar countdown once, not once per eye');
    const fontTick=engine.debugStats().font3d;
    test.assert(fontTick.runtime.layoutRebuilds===fontBeforeTick.layoutRebuilds+1&&fontTick.runtime.liveGlyphs===3&&fontTick.runtime.cachedGlyphs<=3&&fontTick.instanceGeometryBytes===0,'one native countdown revision rebuilds one layout while glyph instances share GPU geometry');
    sim.frame(still);
    test.assert(engine.debugStats().font3d.runtime.layoutRebuilds===fontTick.runtime.layoutRebuilds&&engine.debugStats().font3d.runtime.syncUpdates===fontTick.runtime.syncUpdates,'unchanged stereo frames reuse native layouts and synchronized glyph transforms');
    const boundRoots=[world.timerPanel,world.scorePanel,world.awardPanels[2],...world.stockScorePanels];
    const boundIdentities=boundRoots.map(p=>({id:p.id,position:p.meshInfo.position,text:p.font3DInfo.text}));
    world.arenaFont.set('neon');sim.frame(still);
    test.assert(world.arenaFont.selected==='neon'&&engine.debugStats().numericFont.glyphMeshes===10&&engine.debugStats().numericFont.liveGlyphs===3&&engine.debugStats().font3d.runtime.texts===0,'font switch restores original native neon digits and releases Cynatar bindings');
    world.arenaFont.set('cynatar');sim.frame(still);
    test.assert(boundRoots.every((p,i)=>p.id===boundIdentities[i].id&&p.meshInfo.position.every((v,j)=>Math.abs(v-boundIdentities[i].position[j])<1e-5)&&p.font3DInfo.text===boundIdentities[i].text),'restoring Cynatar preserves all five root IDs, world positions and current native values');
    const panels=[world.timerPanel,world.scorePanel],origins=panels.map(p=>p.meshInfo.position);
    const diagnosticOrigin=world.infoPanel.meshInfo.position;
    const {VR_DEBUG_PANEL_OFFSET}=await import('../examples/shared/vr-debug-panel.js');
    const expectedDiagnostic=[person.head.position[0]+VR_DEBUG_PANEL_OFFSET[0],VR_DEBUG_PANEL_OFFSET[1],person.head.position[2]+VR_DEBUG_PANEL_OFFSET[2]];
    test.assert(person.head.object?.id===world.infoPanel.id&&diagnosticOrigin.every((v,i)=>Math.abs(v-expectedDiagnostic[i])<.003)&&world.infoPanel.meshInfo.scale.every(v=>v===1),'native diagnostics stay unmirrored at the right-foot VR anchor');
    test.assert(origins.every(pos=>Math.abs(pos[0])<.01&&pos[2]<-2)&&origins[0][1]>origins[1][1]&&origins[1][1]>COMBO_DISPLAY_ORIGIN[1],'front countdown is above score and active triple');
    test.assert(!('monument' in world)&&!('credits' in world),'decorative gravestone and its inscription are absent');
    test.assert(world.scoreDisplay.info.textures===0 && world.logo.meshInfo.triangles>20,'central score housing and bitmap APOLLO GAMES lettering');
    const logoPosition=world.logo.meshInfo.position;
    sim.frame(leftLook);const sideLogo=sim.pixels('left');
    world.logo.setPosition([100,100,100]);sim.frame(leftLook);
    test.assert(pixelDifference(sideLogo,sim.pixels('left'),3)>50,'bitmap logo visibly renders above the left paytable');
    world.logo.setPosition(logoPosition);sim.frame(still);
    test.assert(!engine.debugStats().enabled && panels.every(p=>p.font3DInfo.glyphCount>0)&&engine.debugStats().font3d.geometryBytes>0,'timer and score have native Cynatar glyphs uploaded as shared world meshes');
    const frontPanelsLeft=sim.pixels('left'),frontPanelsRight=sim.pixels('right');
    panels.forEach(p=>p.setPosition([100,100,100]));sim.frame(still);
    test.assert(pixelDifference(frontPanelsLeft,sim.pixels('left'))>100 && pixelDifference(frontPanelsRight,sim.pixels('right'))>100,'countdown and score visibly render in both eyes');
    panels.forEach((p,i)=>p.setPosition(origins[i]));
    sim.frame({...still,head:{position:[.25,1.55,0]}});
    test.assert(panels.every((p,i)=>p.meshInfo.position.every((v,j)=>Math.abs(v-origins[i][j])<1e-5)),'head motion preserves world panel positions');
    sim.frame(still);
    const blackFrame=sim.pixels('left');let blackPixels=0;
    for(let i=0;i<blackFrame.data.length;i+=4)if(blackFrame.data[i]<3&&blackFrame.data[i+1]<3&&blackFrame.data[i+2]<3)blackPixels++;
    test.assert(blackPixels>blackFrame.width*blackFrame.height*.3,'stereo scene has a real black background');
    const postprocessing=engine.postprocessing.stats();
    test.assert(postprocessing.passes===2&&postprocessing.targets>0&&postprocessing.ssrWidth===postprocessing.width/2,'SSR traces half-resolution then composites into full-size XR');
    // Look down into the playable space and prove the real tiled floor contributes to both eye images.
    const down={...still,head:{position:[0,1.55,0],orientation:[-Math.sin(Math.PI/6),0,0,Math.cos(Math.PI/6)]}};
    sim.frame(down);const floorLeft=sim.pixels('left'),floorRight=sim.pixels('right');
    const tilePosition=world.floorTiles.meshInfo.position,groutPosition=world.floorGrout.meshInfo.position;
    world.floorTiles.setPosition([100,100,100]);world.floorGrout.setPosition([100,100,100]);sim.frame(down);
    test.assert(pixelDifference(floorLeft,sim.pixels('left'),2)>20&&pixelDifference(floorRight,sim.pixels('right'),2)>20,'reflective tiled floor is visible in BOTH downward-looking XR eyes');
    world.floorTiles.setPosition(tilePosition);world.floorGrout.setPosition(groutPosition);sim.frame(still);
    test.assert(!performance.getEntriesByType('resource').some(r=>/\/(?:color|emission)-(?:px|nx|py|ny|pz|nz)\.png/.test(r.name)),'arena never loads environment image assets');
    const neonLeft=sim.pixels('left'),neonRight=sim.pixels('right');
    test.assert(engine.debugStats().neonGlow.enabled&&engine.debugStats().neonGlow.draws>0,'texture-free glow draws in the real stereo renderer');
    engine.setNeonGlow({strength:0});sim.frame(still);
    test.assert(pixelDifference(neonLeft,sim.pixels('left'),2)>20&&pixelDifference(neonRight,sim.pixels('right'),2)>20,'glow adds visible colored light in BOTH eyes, including the offset right viewport');
    test.assert(engine.debugStats().neonGlow.cachedMeshes===0,'disabling glow releases its stable-ID mesh cache');
    engine.setNeonGlow(NEON_GLOW);sim.frame(still);
    const first=app.gameState().liveApples[0],startY=first.meshInfo.position[1];
    for(let i=0;i<25;i++)sim.frame({...still,dt:1000/72});
    test.assert(first.meshInfo.position[1]>startY+.08 && first.meshInfo.position[1]<startY+.3,'launched neon fruit follows the gentler Rust physics arc');
    for(const target of app.gameState().liveApples)if(target.exists)target.remove();
    const flight=launchApple(engine.scene,world.fruits.find(f=>f.name==='watermelon'),-1),flightSamples=[];
    for(let i=0;i<4;i++){
        const pos=flight.meshInfo.position;flightSamples.push(pos);
        test.assert(pos[1]>=1.10 && pos[1]<=1.65 && Math.abs(pos[0])<.5 && pos[2]>-1.12 && pos[2]<-.95,'production trajectory stays in a comfortable forward reach for over a second');
        // Production frames must stay below the engine's large-delta clamp.
        for(let frame=0;frame<32;frame++)sim.frame({...still,dt:1000/72});
    }
    flight.remove();
    test.report.evidence={flightSamples};
    // Production blade contacts remain active even while the hand is stationary.
    for(const target of app.gameState().liveApples)if(target.exists)target.remove();
    const incoming=engine.scene.createMesh(world.fruits[0].geometry).setPosition([.76,1.3,-.9])
        .setScale([.13,.13,.13]).setColorCutout(.25).setEmission(1.1)
        .setCuttable(true,{capColor:cutFaceColor(world.fruits[0])}).projectile([-1.8,0,0],{gravity:0,bounce:.65});
    const held={...still,dt:1000/72,controllers:{...still.controllers,
        right:{position:[.45,1.3,-.3],orientation:[0,0,0,1],pressed:false}}};
    const oldContacts=engine.projectileContacts();let nearest=incoming.meshInfo.position[0];
    for(let i=0;i<24;i++){sim.frame(held);nearest=Math.min(nearest,incoming.meshInfo.position[0]);}
    test.assert(incoming.exists&&!reports.some(report=>report.removed.includes(incoming.id)),'a held sword rebounds incoming fruit without inventing a stationary cut');
    test.assert(engine.projectileContacts()>oldContacts&&incoming.meshInfo.position[0]>nearest+.08,'real fruit reverses direction after hitting the stationary blade flat');
    incoming.remove();
    const supportPose={...held,controllers:{...held.controllers,
        right:{position:[.45,1.1,-.3],orientation:[0,0,Math.SQRT1_2,Math.SQRT1_2],pressed:false}}};
    sim.frame(supportPose);
    const supported=engine.scene.createMesh(world.fruits.find(f=>f.name==='watermelon').geometry)
        .setPosition([.45,1.52,-.9]).setScale([.13,.13,.13]).setEmission(1.1)
        .projectile([0,-.1,0],{gravity:8,bounce:0}).spin([0,3,0]);
    const supportContacts=engine.projectileContacts();let settledRotation;
    for(let i=0;i<180;i++){
        sim.frame(supportPose);
        if(i===140)settledRotation=supported.meshInfo.rotation;
    }
    const supportInfo=supported.meshInfo;
    test.assert(engine.projectileContacts()>supportContacts&&Math.abs(supportInfo.bottom-1.104)<.035,
        'real production fruit lands and stays on the finite horizontal sword surface');
    test.assert(supportInfo.rotation.every((v,i)=>Math.abs(v-settledRotation[i])<.03),
        'support friction stops the authored spin instead of replaying the base rotation');
    snapshot('support');
    test.report.evidence.supportPng=document.getElementById('support').toDataURL();
    const supportLeft=sim.pixels('left'),supportRight=sim.pixels('right');
    supported.remove();sim.frame(supportPose);
    test.assert(pixelDifference(supportLeft,sim.pixels('left'),2)>10&&pixelDifference(supportRight,sim.pixels('right'),2)>10,
        'supported fruit is visibly rendered in both simulated XR eyes');

    for(let i=1;i<=16;i++)sim.frame(frontTap(1.75-i/16*.4));
    test.assert(!engine.xr.roundState.finished&&engine.xr.roundState.duration===60&&sim.timerCountForDelay(100)===1,'a nearby sword tap on forward START begins the next round without turning back');
    test.assert(!engine.xr.lastError,'real stereo rendering completes without XR error',engine.xr.lastError);
    await engine.xr.exit();
    test.assert(!person.head.tracked&&!person.rightHand.tracked&&person.inventory.length===2,'XR exit clears poses while retaining owned equipment for reentry');
    test.assert(sim.timerCountForDelay(100)===0 && !app.gameState().launching,'XR exit releases launch timer');
    await engine.xr.enter();test.assert(sim.timerCountForDelay(100)===1,'XR reentry owns exactly one timer');
    await engine.xr.exit();
    test.report.evidence={...test.report.evidence,cuts:reports.length,panels:panels.map(p=>p.id),background:'black',postprocessPasses:engine.postprocessing.stats().passes};
});
if(app?.engine.xr.isPresenting)await app.engine.xr.exit();
if(previousPreset===null)localStorage.removeItem('neon-arena.wave-preset.v1');else localStorage.setItem('neon-arena.wave-preset.v1',previousPreset);
