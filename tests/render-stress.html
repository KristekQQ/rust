<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<title>Rust – culling a instancing</title>
<style>body{margin:0;font:14px system-ui;color:white}canvas{width:100vw;height:100vh;display:block}aside{position:fixed;left:12px;top:12px;background:#171727ed;padding:16px;border-radius:8px}pre{white-space:pre-wrap}button{padding:6px}</style>
<canvas id="gpu-canvas" aria-label="Test instancování"></canvas>
<aside><strong>10 000 krychlí · Rust renderer</strong><p>100 před kamerou, 9 900 mimo záběr.</p>
<label><input id="culling" type="checkbox" checked> Frustum culling</label>
<button id="sample">Ukázková scéna</button><pre id="status" role="status">Načítám…</pre></aside>
<script type="module">
try {
    const {initEngine} = await import(`../js/engine.js?v=${Date.now()}`);
    const engine = await initEngine(document.getElementById("gpu-canvas"),{backend:new URLSearchParams(location.search).get("backend") || "auto"});
    engine.set_grid_visible(false);
    for(let i=0;i<10000;i++) {
        const position = i<100 ? [(i%10-4.5)*0.4,(Math.floor(i/10)-4.5)*0.4,0] : [1000+i,0,0];
        engine.scene.createCube(position).setScale([0.25,0.25,0.25]);
    }
    engine.scene.createLight({position:[3,4,5]});
    document.getElementById("culling").onchange = event => engine.set_frustum_culling(event.target.checked);
    document.getElementById("sample").onclick = () => engine.scene.loadExample();
    const samples=[];
    setInterval(() => {
        const stats = engine.renderer_stats();
        samples.push(stats.prepareMs); if(samples.length>30) samples.shift();
        document.getElementById("status").textContent = `${engine.renderer_backend()}\nObjekty: ${stats.total}\nViditelné: ${stats.visible}\nVyřazené: ${stats.culled}\nDraw calls objektů: ${stats.drawCalls}\nUpload posledního snímku: ${stats.uploadBytes} B\nCPU příprava průměr: ${(samples.reduce((a,b)=>a+b,0)/samples.length).toFixed(3)} ms\nČas nezahrnuje GPU ani prezentaci.`;
    },200);
} catch(error) {document.getElementById("status").textContent=`FAIL: ${error.message}`;console.error(error);}
</script>
</html>
