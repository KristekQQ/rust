<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<title>Rust scene SDK – integration test</title>
<body>
<h1>Rust scene SDK</h1>
<pre id="result" role="status">Probíhá test…</pre>
<canvas id="gpu-canvas" width="640" height="360"></canvas>
<script type="module">
import { createScene } from "../examples/basic/scene.js";
import {capturePixels,assertForeground} from './pixels.js';

const result = document.getElementById("result");
const assert = (ok, message) => { if (!ok) throw new Error(message); };
try {
    const { initEngine } = await import(`../js/engine.js?v=${Date.now()}`);
    const canvas = document.getElementById("gpu-canvas");
    const options = { backend: new URLSearchParams(location.search).get("backend") || "auto" };
    const [engine, concurrent] = await Promise.all([initEngine(canvas, options), initEngine(canvas, options)]);
    assert(engine.frameProfile().enabled===false&&Object.keys(engine.frameProfile().cpu).length===0,'Ordinary runtime has no active CPU/GPU profiler');
    assert(engine === concurrent, 'Concurrent init reuses one engine');
    const reimported = await import(`../js/engine.js?repeat=${Date.now()}`);
    assert(await reimported.initEngine(canvas, options) === engine, 'Repeated SDK import reuses one runtime');
    const detached = document.createElement('canvas'); detached.id = 'gpu-canvas';
    let detachedRejected = false;
    try { await initEngine(detached, options); } catch { detachedRejected = true; }
    assert(detachedRejected, 'Detached canvas rejected');
    engine.setCameraView([5, 3, 5], [0, 0, 0]);
    let cameraRejected = false;
    try { engine.setCameraView([5, 3, 5], [5, 3, 5]); } catch { cameraRejected = true; }
    assert(cameraRejected, 'Degenerate camera target rejected');
    engine.set_camera_mode('orbit');
    document.documentElement.dataset.rendererBackend = engine.renderer_backend();
    const scene = engine.scene;
    assert(scene.objectCount === 0 && scene.lightCount === 0, "Engine must start empty");
    createScene(scene);
    assert(scene.objectCount === 3 && scene.lightCount === 2, "JavaScript sample recipe creates Rust scene state");
    const cube = scene.createCube([-2, 0, 0]);
    cube.setPosition([-1.5, 0, 0]).setScale([0.7, 0.7, 0.7]).setRotation([0, 0, 0]);
    cube.rotate([0, 180, 0], { duration: 0.05 }).removeAfter(0.1);
    assert(cube.exists && scene.objectCount === 4, "Create object through SDK");
    // Only the Rust frame loop advances scene simulation. JS waits for its result.
    const deadline = performance.now() + 5000;
    while (cube.exists && performance.now() < deadline) {
        await new Promise(resolve => requestAnimationFrame(resolve));
    }
    assert(!cube.exists && scene.objectCount === 3, "Rust scheduled removal");
    const replacement = scene.createCube([-2, 0, 0]);
    assert(replacement.id !== cube.id, "Stable IDs");
    let rejected = false;
    try { cube.setPosition([0, 0, 0]); } catch { rejected = true; }
    assert(rejected && replacement.exists, "Stale handles are rejected by Rust");
    replacement.setRenderOptions({ isStatic: true, castsShadow: false, receivesShadow: true }).spin([0, 0.5, 0]);
    replacement.remove();
    const mirror = scene.createPlane([0, 0, -3]).setRenderOptions({ isStatic: true, castsShadow: false, reflectivity: 0.9 });
    scene.setMirror(mirror);
    mirror.setPosition([0, 0, -4]).remove();
    const light = scene.createLight({ position: [0, 3, 0], color: [1, 0, 0] });
    light.orbit({ radius: 2, height: 3, speed: 1 }).stopOrbit().set([0, 3, 0], [1, 1, 1]);
    assert(light.exists && scene.lightCount === 3, "Light SDK");
    light.remove();
    engine.set_grid_visible(false);engine.set_light_helpers_visible(true);
    engine.set_render_effects(true,false);
    scene.createLight({ position: [-3, 4, 2], color: [0.3, 0.2, 0.1] });
    scene.createLight({ position: [3, 4, 2], color: [0.1, 0.2, 0.3] });
    for(let i=0;i<12;i++)await new Promise(requestAnimationFrame);
    const shadows=engine.effects_stats();
    assert(shadows.shadowLightCount===4 && shadows.staticUpdatesByLight.every(n=>n>0) && shadows.dynamicUpdatesByLight.every(n=>n>0), "Four independent shadow lights");
    engine.set_render_effects(false,false);engine.set_grid_visible(true);engine.set_light_helpers_visible(true);
    scene.clear();
    assert(scene.objectCount === 0 && scene.lightCount === 0, "Rust clear");
    createScene(scene);
    engine.postprocessing.configureGodRays({ density: 0.055, exposure: 40 });
    let volumeRejected = false;
    try { engine.postprocessing.configureGodRays({ density: NaN, exposure: 200 }); } catch { volumeRejected = true; }
    assert(volumeRejected, 'Invalid volumetric settings rejected');
    engine.postprocessing.enable('ssr', { strength: 0.7 });
    engine.postprocessing.enable('godRays', { strength: 0.4 });
    for (let i = 0; i < 8; i++) await new Promise(requestAnimationFrame);
    assert(engine.postprocessing.stats().passes === 2, 'Two postprocess passes');
    let ssrRejected=false;
    try { engine.postprocessing.configureSSR({resolutionScale:NaN}); } catch { ssrRejected=true; }
    assert(ssrRejected,'Non-finite SSR scale rejected');
    engine.postprocessing.configureSSR({resolutionScale:.5});
    for (let i=0;i<8;i++)await new Promise(requestAnimationFrame);
    const half=engine.postprocessing.stats();
    assert(half.passes===3&&half.targets===(engine.renderer_backend()==='BrowserWebGpu'?3:4)&&half.ssrWidth===Math.ceil(half.width/2)&&half.ssrHeight===Math.ceil(half.height/2),'Half SSR keeps full-size chained effects with quarter-size trace');
    engine.postprocessing.disable('ssr');
    assert(engine.postprocessing.stats().targets===0,'Topology change invalidates the old resource plan');
    for (let i=0;i<3;i++)await new Promise(requestAnimationFrame);
    assert(engine.postprocessing.stats().ssrPixels===0&&engine.postprocessing.stats().targets===(engine.renderer_backend()==='BrowserWebGpu'?1:2),'Single remaining effect needs only scene color and optional packed depth');
    engine.postprocessing.configureSSR({resolutionScale:1});engine.postprocessing.disable('godRays');
    assert(engine.postprocessing.stats().targets === 0, 'Postprocess targets released');
    scene.clear();engine.set_grid_visible(false);engine.set_light_helpers_visible(false);
    engine.setCameraView([0,0,3],[0,0,0]);
    const panel=scene.createInfoPanel('round',{position:[0,0,0],width:1.4,height:.8});
    assert(panel.exists && panel.meshInfo.triangles>20 && !panel.meshInfo.cuttable,'World text is an ordinary noncuttable scene object');
    const textImage=await capturePixels(canvas);assertForeground(textImage,'World text without scene lights',500);
    const whites=image=>{let n=0;for(let i=0;i<image.data.length;i+=4)if(image.data[i]>180 && image.data[i+1]>180 && image.data[i+2]>180)n++;return n;};
    assert(whites(textImage)>100,'World text remains readable without lights or specular glare');
    const panelId=panel.id;panel.remove();
    assert(!panel.exists && whites(await capturePixels(canvas))<20,'Removing world panel releases its visible geometry');
    const nextPanel=scene.createInfoPanel('scene',{width:1.4,height:.8});
    assert(nextPanel.id!==panelId,'World panels preserve stable IDs');
    scene.clear();assert(!nextPanel.exists && scene.objectCount===0,'Clear removes dynamic panel bindings');
    result.textContent = `PASS: ${engine.renderer_backend()} Rust scene manager + JavaScript SDK\nSingle runtime initialization, detached canvas rejection, camera view, empty start, JavaScript sample, object commands, Rust animation/removal, stable IDs, lights, four shadow maps, helper controls, clear, postprocessing.`;
} catch (error) {
    console.error(error);
    result.textContent = `FAIL: ${error.message}`;
}
</script>
</body>
</html>
