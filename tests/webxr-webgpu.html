        for(const linear of [.02,.18,.5]){
            engine.setBackgroundColor([linear,linear,linear]);
            for(const effects of [false,true]){
                if(effects){engine.postprocessing.enable('ssr',{strength:.92});engine.postprocessing.enable('bloom',{strength:.000001});}
                else{engine.postprocessing.disable('ssr');engine.postprocessing.disable('bloom');}
                const submissions=second.presentationWrites.length;frame();
                const colors=[await second.pixels(0),await second.pixels(1)].map(image=>Array.from(image.data.slice(0,4)));
                test.assert(colors.every(color=>color.slice(0,3).every(value=>Math.abs(value-srgbByte(linear))<=1)&&color[3]===255),`XR encodes linear ${linear} once to sRGB with effects ${effects}`,colors);
                test.assert(second.presentationWrites.length===submissions+1&&second.presentationWrites.at(-1).length===2,'color-managed output retains one final stereo submission');
            }
        }
        engine.postprocessing.disable('ssr');engine.postprocessing.disable('bloom');

        for(let i=0;i<240;i++)sim.frame({dt:1/60,head:{position:[0,1.6,0],orientation:[0,0,0,1]}});
        test.assert(engine.debugStats().instanceUploadPages===0,'clearing the scene releases every imported instance upload page');
        test.assert(performanceReports.length===1&&performanceReports[0].frames===180&&performanceReports[0].fps>0&&performanceReports[0].cpuSubmitMs>=0&&performanceReports[0].eyeViewports.length===2,'bounded XR telemetry reports delivered frame cadence, CPU submission and both eye viewports',performanceReports);
        await second.checkValidation(test);
    }
    const active=sim.session;engine.dispose();
    test.assert(!engine.xr.isPresenting&&active.pendingFrameCount===0,'dispose cancels active GPU XR');
    denyXR=true;
    engine=await initEngine(canvas,{backend:'auto',profiling:true});
    test.assert(engine.renderer_backend()==='BrowserWebGpu','ordinary WebGPU survives unavailable XR adapter');
    test.assert(deniedXRAdapters>0&&ordinaryFallbackAdapters>0,'XR adapter denial retries ordinary adapter',{deniedXRAdapters,ordinaryFallbackAdapters});
    engine.resize(320,240);engine.set_render_effects(false,false);engine.set_grid_visible(false);engine.set_light_helpers_visible(false);
    engine.setCameraView([0,1.6,0],[0,1.6,-2]);
    engine.scene.createCube([0,1.6,-2]);engine.scene.createLight({position:[-2,4,0],color:[1,1,1]});
    test.assert(assertForeground(await capturePixels(canvas),'ordinary desktop GPU after XR adapter denial')>100,'ordinary fallback renders actual desktop geometry');
    test.assert(!await engine.xr.isSupported(),'ordinary adapter does not advertise GPU XR support');
    const requestCount=requests.length;let fallbackRejected=false;
    try{await engine.xr.enter();}catch(error){fallbackRejected=/webgl/i.test(String(error));}
    test.assert(fallbackRejected&&!engine.xr.isPresenting&&requests.length===requestCount,'ordinary adapter rejects XR with WebGL guidance before requesting session');
    engine.dispose();
});
engine?.dispose();for(const binding of bindings)binding.destroy();sim.dispose();
