<!doctype html><html lang="en"><meta charset="utf-8"><title>Static shadow cache invalidation</title>
<canvas id="gpu-canvas" width="384" height="384"></canvas><pre id="result">RUNNING</pre>
<script type="module">
import {initEngine} from '../js/engine.js';
import {assertForeground, assertChanged} from './pixels.js';
const canvas = document.querySelector('canvas');
const nativeRAF = requestAnimationFrame.bind(window), nativeCancel = cancelAnimationFrame.bind(window);
let id = 0, time = 0;
const callbacks = new Map();
window.requestAnimationFrame = callback => { callbacks.set(++id, callback); return id; };
window.cancelAnimationFrame = handle => callbacks.delete(handle);
let engine;
try {
    engine = await initEngine(canvas, {backend: new URLSearchParams(location.search).get('backend') || 'auto'});
    document.documentElement.dataset.rendererBackend = engine.renderer_backend();
    engine.resize(384, 384);
    engine.set_render_effects(true, false);
    engine.set_grid_visible(false);
    engine.set_light_helpers_visible(false);
    engine.scene.clear();
    engine.set_simulation_paused(true);
    engine.setCameraView([4, 4, 6], [0, 0, 0]);
    engine.scene.createLight({position: [-3, 6, 3], color: [1, .7, .6]});
    engine.scene.createLight({position: [4, 5, 0], color: [.4, .6, 1]});
    engine.scene.createLight({position: [0, 7, -4], color: [.6, 1, .5]});
    const caster = engine.scene.createCube([0, 0, 0]).setRenderOptions({isStatic: true, castsShadow: true});
    const marker = engine.scene.createCube([0, -10000, 0]).setRenderOptions({isStatic: true, castsShadow: false});
    // Drive exactly one engine frame per command, like the XR locomotion marker.
    const frame = async () => {
        await new Promise(nativeRAF);
        time += 1000 / 90;
        const pending = [...callbacks.values()]; callbacks.clear();
        for (const callback of pending) callback(time);
    };
    const snapshot = () => {
        const copy = document.createElement('canvas'); copy.width = 384; copy.height = 384;
        const context = copy.getContext('2d'); context.drawImage(canvas, 0, 0);
        return context.getImageData(0, 0, 384, 384);
    };
    for (let i = 0; i < 3; i++) await frame();
    const before = engine.effects_stats(), firstPixels = snapshot();
    assertForeground(firstPixels, 'Static shadow caster');
    for (let i = 0; i < 20; i++) { marker.setPosition([0, -10000, 0]); await frame(); }
    const after = engine.effects_stats();
    const noopStaticUpdates = after.staticUpdates - before.staticUpdates;
    if (before.staticUpdates !== 3) throw Error('Three initial static shadow maps must be rendered');
    if (noopStaticUpdates !== 0) throw Error(`Identical hidden marker position caused ${noopStaticUpdates} static shadow redraws`);
    engine.setCameraView([4.2,4,6],[0,0,0]); await frame();
    const cameraMoved=engine.effects_stats();
    if(cameraMoved.staticUpdates!==after.staticUpdates||cameraMoved.dynamicUpdates!==after.dynamicUpdates)throw Error('Camera movement redraws world shadow maps');
    const beforeCasterMotion=snapshot();
    // Actual geometry changes must still refresh every light and visible pixels.
    caster.setPosition([1, 0, 0]); await frame();
    const moved = engine.effects_stats();
    if (moved.staticUpdates - after.staticUpdates !== 3) throw Error('Actual caster movement did not refresh three shadow maps');
    assertChanged(beforeCasterMotion, snapshot(), 'Static caster movement');
    // Moving real non-casters must not repeatedly clear an already empty map.
    const emptyDynamic = moved.dynamicUpdates;
    for (let i=0;i<8;i++) { marker.setPosition([i, -10000, 0]); await frame(); }
    if(engine.effects_stats().dynamicUpdates!==emptyDynamic)throw Error('Non-caster motion redraws an empty dynamic map');
    const dynamic=engine.scene.createCube([-1,0,0]).setRenderOptions({isStatic:false,castsShadow:true});
    await frame();const occupied=engine.effects_stats();
    if(occupied.dynamicUpdates-emptyDynamic!==3)throw Error('New dynamic caster must redraw every light');
    marker.setRenderOptions({isStatic:false,castsShadow:false,receivesShadow:false}).setScale([.3,.025,.3]).setOpacity(.16);
    for(let i=0;i<8;i++){marker.setPosition([i*.1,-.55,1]);await frame();}
    const unchanged=engine.effects_stats();
    if(unchanged.dynamicUpdates!==occupied.dynamicUpdates||unchanged.staticUpdates!==occupied.staticUpdates)throw Error('Non-caster movement invalidates occupied maps');
    const occupiedPixels=snapshot();
    dynamic.setPosition([-1.5,0,0]);await frame();const dynamicMoved=engine.effects_stats();
    if(dynamicMoved.dynamicUpdates-unchanged.dynamicUpdates!==3)throw Error('Dynamic caster movement must invalidate maps');
    if(dynamicMoved.staticUpdates!==unchanged.staticUpdates)throw Error('Dynamic caster movement redraws static city maps');
    assertChanged(occupiedPixels,snapshot(),'Dynamic caster movement');
    dynamic.setRenderOptions({isStatic:true,castsShadow:true});await frame();const migrated=engine.effects_stats();
    if(migrated.staticUpdates-dynamicMoved.staticUpdates!==3||migrated.dynamicUpdates-dynamicMoved.dynamicUpdates!==3)throw Error('Static/dynamic migration must invalidate both layers');
    dynamic.setRenderOptions({isStatic:false,castsShadow:true});await frame();const restored=engine.effects_stats();
    if(restored.staticUpdates-migrated.staticUpdates!==3||restored.dynamicUpdates-migrated.dynamicUpdates!==3)throw Error('Reverse migration must invalidate both layers');
    dynamic.remove();await frame();const cleared=engine.effects_stats();
    if(cleared.dynamicUpdates-restored.dynamicUpdates!==3)throw Error('Last caster removal must clear stale shadows');
    for(let i=0;i<5;i++){marker.setPosition([-i,-10000,0]);await frame();}
    if(engine.effects_stats().dynamicUpdates!==cleared.dynamicUpdates)throw Error('Cleared shadow maps were resubmitted');
    window.shadowCacheEvidence = {before, after, moved, noopStaticUpdates, movedStaticUpdates: moved.staticUpdates - after.staticUpdates, cameraStaticUpdates:cameraMoved.staticUpdates-after.staticUpdates, cameraDynamicUpdates:cameraMoved.dynamicUpdates-after.dynamicUpdates, dynamicMotionStaticUpdates:dynamicMoved.staticUpdates-unchanged.staticUpdates, dynamicMotionDynamicUpdates:dynamicMoved.dynamicUpdates-unchanged.dynamicUpdates, nonCasterStaticUpdates:unchanged.staticUpdates-occupied.staticUpdates, nonCasterDynamicUpdates:unchanged.dynamicUpdates-occupied.dynamicUpdates};
    document.querySelector('#result').textContent = 'PASS: static/dynamic independent maps, camera/non-caster cache reuse, new/removed casters, actual pixels; '+JSON.stringify(window.shadowCacheEvidence);
} catch (error) {
    document.querySelector('#result').textContent = 'FAIL: ' + error.stack;
    console.error(error);
} finally {
    engine?.dispose(); window.requestAnimationFrame = nativeRAF; window.cancelAnimationFrame = nativeCancel;
}
</script></html>
