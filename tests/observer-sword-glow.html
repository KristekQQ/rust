<!doctype html><meta charset="utf-8"><title>Irregular sword glow alignment</title><canvas id="gpu-canvas"></canvas><pre id="result">RUNNING</pre>
<script type="module">
import {initEngine} from '../js/engine.js';
import {swordGeometry} from '../examples/neon-arena/geometry.js';
import {capturePixels} from './pixels.js';
const result=document.querySelector('#result'),canvas=document.querySelector('canvas');
try{
 const engine=await initEngine(canvas,{backend:new URLSearchParams(location.search).get('backend')||'auto'});
 document.documentElement.dataset.rendererBackend=engine.renderer_backend();
 engine.resize(640,480);engine.setCameraHandedness('right');engine.setCameraView([0,1.3,2],[0,1.3,-.5]);
 engine.set_grid_visible(false);engine.set_light_helpers_visible(false);engine.set_render_effects(false,false);
 engine.setBackgroundColor([0,0,0]);engine.postprocessing.disable('bloom');engine.postprocessing.disable('ssr');
 const sword=engine.scene.createMesh(swordGeometry('left')).setEmission(1.4);
 const poses=[[-.6,1.3,0,0,0,0],[.5,1.5,-.5,.7,-1.1,.8],[-.1,.9,-.4,-.8,.4,-1.2],[-.1,.9,-.4,-.8,.4,-1.2],[.6,1.2,-.3,1.1,.7,2.1],[-.5,1.6,-.5,-.3,-1.2,-.7],[.2,1.1,-.1,.2,.3,-2.3]];
 const evidence=[];
 for(const pose of poses){
  sword.setPosition(pose.slice(0,3)).setRotation(pose.slice(3));
  engine.setNeonGlow({strength:0,radius:.045});const base=await capturePixels(canvas);
  engine.setNeonGlow({strength:.4,radius:.045});const glow=await capturePixels(canvas);
  const mask=new Uint8Array(640*480);let surface=0,added=0,detached=0;
  for(let i=0;i<mask.length;i++)if(Math.max(...base.data.subarray(i*4,i*4+3))>12){mask[i]=1;surface++;}
  for(let y=0;y<480;y++)for(let x=0;x<640;x++){
   const i=y*640+x,p=i*4;
   if(Math.max(glow.data[p]-base.data[p],glow.data[p+1]-base.data[p+1],glow.data[p+2]-base.data[p+2])<20)continue;
   added++;let near=false;
   for(let dy=-24;dy<=24&&!near;dy++)for(let dx=-24;dx<=24;dx++)if(x+dx>=0&&x+dx<640&&y+dy>=0&&y+dy<480&&mask[(y+dy)*640+x+dx]){near=true;break;}
   if(!near)detached++;
  }
  evidence.push({pose,surface,added,detached});
  if(surface<30||added<10)throw Error('Sword/glow missing '+JSON.stringify(evidence.at(-1)));
  if(detached>Math.max(3,added*.01))throw Error('Glow detached from current sword '+JSON.stringify(evidence.at(-1)));
 }
 document.documentElement.dataset.glowEvidence=JSON.stringify(evidence);
 result.textContent='PASS: sword glow follows 7 irregular translation/rotation poses including stop and reversal';
}catch(error){result.textContent='FAIL: '+error.message;console.error(error);}
</script>
