<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<title>Rust · mirrored transform regression</title>
<h1>Záporné měřítko a orientace stěn</h1>
<pre id="result" role="status">Probíhá test…</pre>
<canvas id="gpu-canvas" width="480" height="320"></canvas>
<script type="module">
import { initEngine } from '../js/engine.js';
const result = document.getElementById('result');
const canvas = document.getElementById('gpu-canvas');
const frames = async () => { for (let i=0;i<4;i++) await new Promise(requestAnimationFrame); };
try {
    const engine = await initEngine(canvas, {backend:new URLSearchParams(location.search).get('backend') || 'auto'});
    engine.resize(480,320);
    engine.setCameraView([3,3,6],[0,0,0]);
    engine.set_grid_visible(false);
    engine.set_light_helpers_visible(false);
    engine.scene.createLight({position:[0,5,5],color:[1,1,1]});
    const capture = async () => {
        await frames();
        return new Promise(resolve => requestAnimationFrame(() => {
            const copy=document.createElement('canvas');copy.width=canvas.width;copy.height=canvas.height;
            const ctx=copy.getContext('2d');ctx.drawImage(canvas,0,0);
            resolve(ctx.getImageData(0,0,copy.width,copy.height).data);
        }));
    };
    for (const kind of ['createCube','createSphere']) {
        const object=engine.scene[kind]([0,0,0]);
        const before=await capture();
        object.setScale([-1,1,1]);
        const after=await capture();
        let changed=0, foreground=0, blue=0;
        for (let i=0;i<before.length;i+=4) {
            if (Math.abs(before[i]-before[0])+Math.abs(before[i+1]-before[1])+Math.abs(before[i+2]-before[2])>12) foreground++;
            if (after[i+2]>20 && after[i+2]>2*Math.max(after[i],after[i+1])) blue++;
            if (Math.abs(before[i]-after[i])+Math.abs(before[i+1]-after[i+1])+Math.abs(before[i+2]-after[i+2])>12) changed++;
        }
        if(foreground<1000) throw new Error(`${kind}: no rendered geometry in capture`);
        if(kind==='createCube' && blue<100) throw new Error('Mirrored cube must show its blue outward side');
        if(kind==='createSphere' && changed>foreground*.02) throw new Error(`${kind}: mirrored surfaces differ (${changed}/${foreground})`);
        object.remove();
    }
    // Exercise both winding groups simultaneously and their draw-call accounting.
    engine.scene.createCube([-1,0,0]);
    engine.scene.createCube([1,0,0]).setScale([-1,1,1]);
    await frames();
    if(engine.renderer_stats().drawCalls !== 2) throw new Error('Mixed winding groups must use two draws');
    result.textContent=`PASS: ${engine.renderer_backend()} · cube/sphere pixel comparison, mixed winding batches and draw counts.`;
} catch(error) { console.error(error);result.textContent=`FAIL: ${error.message}`; }
</script>
</html>
