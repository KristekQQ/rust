<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cynatar · 3D neon</title>
<style>*{box-sizing:border-box}body{margin:0;background:#02050c;color:#d4e7ff;font:14px system-ui}#gpu-canvas{display:block;width:100vw;height:100vh}aside{position:absolute;left:24px;top:20px;width:min(390px,calc(100vw - 48px));padding:16px;background:#020712d9;border:1px solid #17334f;border-radius:12px}h1{font-size:22px;letter-spacing:.18em;margin:0 0 6px}p{color:#8fa9c6;line-height:1.5;margin:6px 0}label{display:flex;align-items:center;gap:10px;margin-top:10px}input,select{accent-color:#00c8ff;min-width:0}#text{flex:1;width:100%;padding:7px;background:#071829;color:#e7f5ff;border:1px solid #285588;border-radius:5px}input:invalid{border-color:#ff7d9f!important}button,a,select{color:#c7e3ff;border:1px solid #285588;background:#061225;border-radius:6px;padding:6px 9px;text-decoration:none}button,a{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #4eeaff;outline-offset:3px}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}#status,.license{font-size:11px}#result{display:block;margin-top:8px;max-width:100%;color:#ffb5cd;font-size:12px}output{font-variant-numeric:tabular-nums}details{margin-top:10px}summary{cursor:pointer}@media(max-width:600px){aside{left:12px;top:12px;width:calc(100vw - 24px);padding:10px}h1{font-size:18px}}body{display:grid;grid-template-columns:310px minmax(0,1fr)}#gpu-canvas{grid-column:2;grid-row:1;width:100%;height:100vh}aside{grid-column:1;grid-row:1;position:static;width:auto;max-width:none;margin:18px 0 18px 18px;align-self:start;padding:15px}label{flex-wrap:wrap}input[type=range]{flex:1;width:120px}.license a{display:inline-block;margin-top:4px}@media(max-width:700px){body{display:flex;flex-direction:column}aside{order:0;margin:10px;width:calc(100% - 20px);padding:12px}#gpu-canvas{order:1;width:100%;height:62vh;min-height:320px}label{margin-top:7px}h1{font-size:18px}aside>p:first-of-type br{display:none}}
</style>
<canvas id="gpu-canvas" aria-label="3D náhled písma Cynatar"></canvas>
<aside><h1>CYNATAR</h1><p>Originální řezy písma v prostorové geometrii.<br>Jasné čelo, barevně svítící boky a neonové hrany.</p>
<label for="font">Font <select id="font"><option value="cynatar">Cynatar · importovaný</option><option value="pixel">Pixel · vestavěný</option></select></label>
<label for="text">Text <input id="text" value="CYNATAR" maxlength="24" spellcheck="false" autocomplete="off" aria-describedby="font-note"></label>
<p id="font-note" class="license">Do 24 znaků. Nepodporované znaky se zobrazí jako chyba.</p>
<label for="color">Barva <select id="color"><option value="cyan">Azurová</option><option value="magenta">Purpurová</option></select></label>
<label for="emission">Svítivost <input id="emission" type="range" min="0" max="8" step=".1" value="4"><output id="emission-value">4.00</output></label>
<label for="glow">Záře <input id="glow" type="range" min="0" max="1.2" step=".05" value=".4"><output id="glow-value">0.40</output></label>
<nav><button id="front">Zepředu</button><button id="angle">Zešikma</button><a href="../neon-arena/">Aréna</a></nav>
<p id="status" role="status">Načítání…</p><p class="license">Font pouze pro osobní použití · <a href="https://www.dafont.com/cynatar.font" target="_blank" rel="noopener">Cynatar a licence</a></p>
<details id="checks"><summary>Ověření obrazu</summary><button id="verify">Ověřit obraz</button></details><output id="result" role="status" aria-live="polite"></output></aside>
<script type="module">if(new URLSearchParams(location.search).get('verify')==='1')document.querySelector('#checks').open=true;import('./main.js').catch(error=>{document.querySelector('#result').textContent=`FAIL: ${error}`;});</script></html>
