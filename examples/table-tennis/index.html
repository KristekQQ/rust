<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stolní tenis · Rust engine</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080e19;color:#e7f2fa;font:15px system-ui}canvas{display:block;width:100vw;height:100dvh;touch-action:none}header{position:absolute;top:24px;left:30px;pointer-events:none}h1{font-size:14px;letter-spacing:.23em;color:#7ccbd6;margin:0 0 10px}#score{font-size:56px;font-weight:750;line-height:1}small{color:#8b9eaf;font-size:12px}footer{position:absolute;bottom:24px;left:30px;right:30px;display:flex;align-items:end;justify-content:space-between;gap:20px;pointer-events:none}p{margin:6px 0;max-width:570px;line-height:1.5;color:#b5c9d7}nav{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap}button,a{background:#142637;color:#dff5fa;border:1px solid #345364;border-radius:8px;padding:11px 15px;text-decoration:none;cursor:pointer}button:hover{background:#254557}button:disabled{opacity:.4;cursor:default}#result{position:absolute;right:20px;top:20px;font-size:12px;max-width:40vw}#verify{display:none}@media(max-width:600px){header{left:16px;top:16px}footer{left:16px;right:16px;bottom:16px;display:block}nav{margin-top:12px}#score{font-size:40px}}
