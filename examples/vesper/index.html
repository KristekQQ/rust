<script id="tunnel-frag" type="text/plain">
uniform vec4 tunnelHits; // age and strength of the two most recent bass attacks
float pulseRing(float r,vec2 hit){
 float age=hit.x;
 float wave=.10+.55*age+3.6*age*age;
 float width=.028+.075*wave;
 float d=(r-wave)/width;
 return hit.y*exp(-d*d)*smoothstep(0.,.032,age)*(1.-smoothstep(.56,.77,age));
}
vec3 tunnel(vec2 p){
 p=layerPoint(p,1.5)-.13*vec2(sin(time*.8),cos(time*.63));
 float r=max(length(p),.008), a=atan(p.y,p.x);
 float shock=pulseRing(r,tunnelHits.xy)+pulseRing(r,tunnelHits.zw);
 float z=1./(r+.08+.026*shock), travel=z+time*1.65+2.35*passageEye.z;
 float twist=a+.58*sin(z*.82-time*.38)+.2*time+.49*percussion.y*sin(.74*z-.38*time);
 float ribs=abs(fract(travel*1.65)-.5);
 float seams=abs(sin(6.*twist));
 vec3 tint=mix(vec3(.03,1.1,.86),vec3(.37,.06,.94),.5+.5*cos(twist*3.+travel*.8));
 float edge=exp(-25.*ribs)+.32*exp(-6.*ribs);
 float rail=exp(-22.*seams);
 float depth=smoothstep(.035,.55,r);
 vec3 flare=smoothstep(.05,.23,r)*shock*(.30+.80*edge)*mix(tint,vec3(.74,1.,1.),.42);
 float glint=percussion.z*rail*pow(.5+.5*cos(3.*twist+travel*1.9),4.);
 return 1.55*flare+depth*glint*vec3(.78,.87,1.24)+vec3(.009,.014,.03)+depth*tint*(edge*(.38+.9*band.x)+rail*(.32+band.z+1.5*percussion.z))+
   depth*vec3(.58,.92,.9)*rail*edge;
}
</script>

<script id="meeting-fog" type="text/plain">
precision highp float;
uniform sampler2D plate;
uniform vec2 size;
uniform float clock;
vec3 depthBins(float z){
 float slice=clamp((z-1.4)/.72,0.,2.);
 return max(vec3(0.),1.-abs(slice-vec3(0.,1.,2.)));
}
// RGB stores density at three distances from the viewer, near to far.
void main(){
 vec2 screen=(2.*gl_FragCoord.xy-size)/size.y;
 vec3 density=vec3(0.);
 float halfWidth=size.x/size.y;
 for(int nozzle=0;nozzle<2;nozzle++){
  float side=float(nozzle)*2.-1.,period=.49+.04*side;
  float stream=clock/period+.42*float(nozzle);
  for(int j=0;j<16;j++){
   float birth=floor(stream)-float(j),age=(fract(stream)+float(j))*period;
   if(birth<0. || age>7.3)continue;
   // Packets leave the same outlets with different inward momentum.
   // The slower exhaust rolls up the wings while the stronger jets meet.
   float lane=mod(birth+float(nozzle)*2.,5.);
   float edgeFlow=lane<2.?1.:(lane<3.?.58:0.);
   float join=clamp(age/mix(3.1,5.1,edgeFlow),0.,1.);
   float momentum=(1.-join)*(1.-join);
   float rise=max(0.,age-3.1),seed=birth*2.39996+side*1.7;
   // The opposed horizontal velocities decay to zero at the meeting point.
   // Warm mixed air then accelerates upward towards its terminal rise speed.
   float y=-.94+mix(.17,.20,edgeFlow)*age+(1.-edgeFlow)*.15*(rise-(1.-exp(-1.6*rise))/1.6);
   float mixing=smoothstep(1.15,3.25,age);
   float drift=.11*sin(.93*clock-2.6*y)+.065*sin(1.7*y+.37*clock);
   float curl=seed+age*1.18;
   float depth=2.35+.25*side*momentum+mixing*(.51*sin(curl)-.11*rise);
   float outer=.83+.12*sin(.78*age+seed);
   float laneX=mix(momentum,outer+(1.-outer)*momentum,edgeFlow);
   float x=side*.98*halfWidth*laneX+mixing*(drift+.14*cos(curl))+.055*join*sin(seed);
   vec2 center=vec2(x,y)*2.35/depth;
   float spread=.105+.145*sqrt(age)+.045*rise;
   vec2 radius=vec2(spread*(1.42+.34*edgeFlow),.13+.133*age)*2.35/depth;
   radius.x*=clamp(halfWidth/1.6,.66,1.45);
   vec2 pos=screen-center;
   if(dot(pos,pos)>dot(radius,radius))continue;
   float angle=side*(.16+.26*join)+.31*mixing*sin(curl);
   pos=mat2(cos(angle),sin(angle),-sin(angle),cos(angle))*pos;
   vec2 q=.5*pos/radius;
   q.x*=mod(birth,2.)*2.-1.;
   if(max(abs(q.x),abs(q.y))>.55)continue;
   q+=.035*vec2(sin(8.*q.y+.71*age+seed),cos(9.*q.x-.46*age+seed));
   vec2 uv=.5+q*vec2(1.,-1.);
   vec2 edge=smoothstep(vec2(0.),vec2(.045),min(uv,1.-uv));
   float mass=texture2D(plate,clamp(uv,0.,1.)).r*edge.x*edge.y;
   mass*=smoothstep(0.,.19,age)*(1.-smoothstep(4.1,7.3,age))*(.90+.10*sin(seed));
   mass*=mix(1.-.40*smoothstep(2.2,4.9,age),1.12,edgeFlow);
   density+=mass*depthBins(depth);
  }
 }
 // Look through a train of rolling billows launched at the viewer's feet.
 // Perspective comes from the ray intersections and the distance to each
 // billow, so its curls stay attached as it recedes towards the stage.
 vec3 ray=vec3(screen/2.35,1.);
 float flow=clock/1.05, footLight=0.;
 for(int j=0;j<9;j++){
  float birth=floor(flow)-float(j);
  if(birth<0.)continue;
  float age=(fract(flow)+float(j))*1.05;
  float side=mod(birth,2.)*2.-1.,seed=birth*2.39996;
  float z=-.35+1.06*age+.54*(1.-exp(-1.9*age));
  float lift=smoothstep(2.2,7.4,age);
  float loft=1.-exp(-1.35*age);
  vec3 center=vec3(side*(.53+.21*sin(seed))+.14*sin(.66*age+seed),
                   -1.18+.48*loft+.065*sin(.86*age+seed)+.57*lift,z);
  float scale=.94+.14*cos(seed);
  vec3 radii=scale*vec3(.43+.14*loft+.018*age,.29+.16*loft+.018*age,.68+.12*loft+.045*age);
  vec3 d=ray/radii,c=center/radii;
  float dd=dot(d,d),mid=dot(d,c)/dd;
  float chord=1.-dot(mid*d-c,mid*d-c);
  if(chord<=0.)continue;
  float halfChord=sqrt(chord/dd);
  float entry=max(.12,mid-halfChord),exitZ=mid+halfChord;
  if(exitZ<=entry)continue;
  float trans=1.;
  for(int k=0;k<5;k++){
   float sampleZ=mix(entry,exitZ,(float(k)+.5)/5.);
   vec3 local=(sampleZ*ray-center)/radii;
   float roll=.56*sin(.67*age+seed)+.30*local.y;
   vec2 fold=mat2(cos(roll),sin(roll),-sin(roll),cos(roll))*local.xz;
   vec2 uv=.5+.42*vec2(side*fold.x+.28*fold.y,-local.y+.23*fold.y);
   uv+=.045*vec2(sin(local.y*5.+age*.72+seed),cos(fold.x*6.-age*.51+seed));
   float curl=texture2D(plate,clamp(uv,0.,1.)).r;
   float shell=1.-smoothstep(.52,1.,length(local));
   float mass=3.85*curl*shell*(exitZ-entry)/5.*(1.-smoothstep(5.9,8.8,age));
   density+=mass*depthBins(sampleZ);
   // Separate illumination of the near-facing surface from its dark interior.
   float facing=clamp(.54+.42*local.y-.36*local.z,0.,1.);
   footLight+=trans*(1.-exp(-mass))*facing*(1.-smoothstep(1.6,5.1,sampleZ));
   trans*=exp(-mass);
  }
 }
 gl_FragColor=vec4(1.-exp(-1.45*density),1.-exp(-1.8*footLight));
}
</script>
<script id="frag" type="text/plain">
precision highp float;
uniform vec2 size;
uniform float time, showBeat, flight;
uniform sampler2D vortexView,fogVolume;
uniform bool hasVortex, wholeFracture;
uniform float grainTone;
uniform vec3 impactTrail; // the same accent at +80, +160 and +240 ms after impact
uniform vec3 musicCue; // preparation, impact, preanalysed track
uniform vec2 tourScenes;
uniform bool chromPassage;
uniform vec3 percussion; // kick, snare attack and high-frequency attack
uniform vec3 band;
uniform vec4 accents, wallAges;
uniform vec3 camPos, camForward, camRight, camUp;
uniform sampler2D starChart;
uniform vec2 chartSize;
uniform vec4 featuredStars[3];
uniform float mood;
uniform vec2 rave; // phrase intensity and signed kick accent
mat2 turn(float a){float c=cos(a),s=sin(a);return mat2(c,s,-s,c);}
// Displacement in units of the exit plane's distance from the resting eye.
vec3 passageEye;
vec2 layerPoint(vec2 ray,float depth){
 return ray*(1.-passageEye.z/depth)+passageEye.xy/depth;
}
vec3 local(vec3 p){
 p.xy=turn(-.34-.12*sin(time*.22)+.27*percussion.y)*p.xy;
 p.yz=turn(.54+.26*sin(time*.29))*p.yz;
 return p;
}
// Cut the rotating ribbon into persistent angular pieces, so each fragment
// returns to its own place as the transient decays.
float surface(vec3 p,float opening){
 p=local(p);
 float radial=length(p.xy),a=atan(p.y,p.x),wave=3.*a-time*.74;
 vec2 q=vec2(radial-1.02-.21*percussion.x-(.115+.11*percussion.y)*cos(wave),p.z-.22*sin(wave));
 float twist=1.5*a+.43*sin(wave)+time*.32+.62*percussion.y;
 if(!wholeFracture && musicCue.z>.5){
  // Tension twists the actual cross-section before the hit. The release
  // follows both lips around the ring, using delayed samples of that hit.
  twist+=musicCue.x*(.28+.22*sin(2.*a));
  float phase=1.5*(1.-cos(a-.48))*.999;
  vec4 taps=vec4(musicCue.y,impactTrail);
  vec3 weights=clamp(phase-vec3(0.,1.,2.),0.,1.);
  float release=taps.x+dot(taps.yzw-taps.xyz,weights);
  opening=clamp(opening+release,0.,1.);
 }
 // Broad corrugations change the silhouette and the reflected studio lights.
 if(!wholeFracture){
  twist+=grainTone*(.23*sin(6.*a+.31*time)+.12*sin(11.*a-.19*time));
  q.y-=grainTone*.033*cos(12.*a+.35*time);
 }
 float cut=-2.;
 if(wholeFracture && opening>.001){
  const float pitch=6.2831853/9.;
  float sector=(a+.055*sin(3.*a+.8)+.038*sin(2.*a-.4))/pitch+4.5;
  float id=mod(floor(sector),9.);
  float seed=fract(id*.618034+.17);
  float lift=opening*(.40+.60*seed);
  q-=lift*vec2(.34,.39*sin(4.2*id+1.));
  twist+=lift*(seed-.5)*2.2;
  float edge=.5-abs(fract(sector)-.5);
  cut=(.20*opening-edge)*pitch*radial;
 }
 q=turn(twist)*q;
 vec2 axes=vec2(.31+band.x*.10+.14*percussion.x,.115+band.x*.035);
 float ribbon=(length(q/axes)-1.)*axes.y;
 if(!wholeFracture && opening>.001){
  // Follow both lips of the half-twisted strip on a single double cover.
  // Crossing the angular seam swaps the local lips but keeps the chip ID.
  const float pitch=6.2831853/22.;
  float side=q.x<0.?-1.:1.;
  float angle=a+(side<0.?6.2831853:0.);
  float cell=(angle+.041*sin(4.*angle)+.026*cos(7.*angle))/pitch;
  float id=mod(floor(cell),44.),seed=fract((id+.5)*.618034);
  vec2 lip=vec2(abs(q.x),side*q.y);
  float burst=smoothstep(.43,.98,opening);
  float root=axes.x*(.71+.048*sin(3.*angle+.8)+.032*cos(9.*angle)
                      -burst*(.24+.20*seed));
  float spine=max(ribbon,lip.x-root-.27*lip.y);
  float peel=opening*smoothstep(.04,.77,opening+.42*seed);
  vec2 offset=peel*vec2(.09+.22*seed,.105*sin(2.7*id+.4))
             +burst*vec2(.08+.12*seed,.16*cos(2.7*id));
  vec2 chip=turn(peel*(seed-.5)*1.85)*(lip-vec2(root,0.)-offset)+vec2(root,0.);
  float shell=(length(chip/axes)-1.)*axes.y;
  float ends=(abs(fract(cell)-.5)-(.5-peel*(.085+.12*seed)))*pitch*radial;
  float flake=max(shell,max(root+.27*chip.y-chip.x,ends));
  if(burst>.001){
   // A second, oblique fault splits the tip off each lifted scale.
   // Both shards use the same rest-space plane, so they fit again on release.
   float tipRoot=mix(root,axes.x,.49+.14*seed);
   float slope=.53*sin(1.9*id+.6);
   flake=max(flake,chip.x-tipRoot+slope*chip.y);
   vec2 tipPivot=vec2(tipRoot,0.);
   vec2 flight=burst*vec2(.09+.21*seed,.22*cos(id*2.1+.7));
   vec2 tip=turn(burst*(seed-.5)*3.6)*(chip-tipPivot-flight)+tipPivot;
   float tipShell=(length(tip/axes)-1.)*axes.y;
   float tipFace=tipRoot-tip.x-slope*tip.y;
   float tipEnds=ends+pitch*radial*.085*burst;
   flake=min(flake,max(tipShell,max(tipFace,tipEnds)));
  }
  return min(spine,flake);
 }
 return mix(ribbon,max(ribbon,cut),smoothstep(.001,.19,opening));
}
vec3 studio(vec3 r){
 float a=atan(r.y,r.x), h=r.z+.18*sin(3.*a+time*.18);
 vec3 c=mix(vec3(.022,.014,.047),vec3(.33,.10,.17),.5+.5*r.y);
 c+=vec3(1.6,.49,.16)*exp(-9.*abs(h+.24));
 c+=vec3(2.5,1.68,1.02)*exp(-28.*abs(h+.12));
 c+=vec3(.52,.36,1.25)*exp(-8.*abs(h-.42));
 c+=vec3(1.4,1.45,1.9)*exp(-36.*abs(h-.55));
 return c;
}
vec3 chromeRibbon(vec2 uv){
 float opening=smoothstep(.12,.78,percussion.x+.26*percussion.y);
 if(!wholeFracture && musicCue.z>.5)
  opening=.54*opening*(1.-.90*musicCue.x);
 float fit=min(1.,size.x/size.y*.96);
 if(!wholeFracture)fit*=.94-.10*smoothstep(.43,.98,opening);
 if(!wholeFracture)uv=turn(.055*musicCue.x)*uv*vec2(1.+.085*musicCue.x,1.-.045*musicCue.x);
 vec2 screen=uv/fit;
 vec3 ro=vec3(passageEye.xy*(2.9/(2.12*fit)),3.95-2.9*passageEye.z);
 vec3 rd=normalize(vec3(screen,-2.12));
 screen=layerPoint(uv,2.3)/fit;
 float fog=exp(-1.8*length(screen*vec2(.89,1.2)-vec2(.22,.03)));
 vec3 col=vec3(.010,.007,.018)+fog*vec3(.050,.015,.035);
 float closest=1.,edgeDepth=0.;
 float t=max(.015,2.05-2.9*passageEye.z),d=1.;
 for(int i=0;i<84;i++){
  d=surface(ro+rd*t,opening);
  if(d<closest){closest=d;edgeDepth=t;}
  if(d<.0015 || t>5.6-2.9*passageEye.z) break;
  t+=max(.001,d*.80);
 }
 // Reuse the nearest point on this ray to scatter light off the actual
 // silhouette, including the inner rim and the individual flying flakes.
 vec3 edgePoint=local(ro+rd*edgeDepth);
 float warmth=.5+.5*sin(2.2*edgePoint.x+1.4*edgePoint.z+.24*time);
 vec3 edgeLight=mix(vec3(.58,.19,1.32),vec3(1.55,.49,.17),smoothstep(.13,.87,warmth));
 vec3 hotEdge=mix(edgeLight,vec3(1.45,1.24,1.34),.64);
 float power=.98+.24*band.z+.23*percussion.y;
 if(d>=.0015){
  float gap=max(0.,closest-.0015);
  // Project the ray clearance onto the image plane, so the scattering
  // widths also follow the apparent contour during a camera move.
  float spread=gap*3.95/max(edgeDepth,1.);
  vec2 haze=exp(-spread*vec2(49.,16.));
  col+=power*(hotEdge*1.65*exp(-spread*155.)
             +edgeLight*(.91*haze.x+.28*haze.y));
 }else{
  vec3 p=ro+t*rd; vec2 e=vec2(.0016,0.);
  vec3 n=normalize(vec3(surface(p+e.xyy,opening)-surface(p-e.xyy,opening),surface(p+e.yxy,opening)-surface(p-e.yxy,opening),surface(p+e.yyx,opening)-surface(p-e.yyx,opening)));
  vec3 r=reflect(rd,n), lp=local(p);
  float a=atan(lp.y,lp.x);
  float grooves=.5+.5*cos(a*110.+lp.z*44.);
  if(!wholeFracture){
   float brush=sin(23.*a+6.*lp.z+.28*time);
   vec3 tangent=rd-n*dot(rd,n);
   n=normalize(n+.18*grainTone*brush*tangent);
   r=reflect(rd,n);
  }
  vec3 metal=studio(r)*mix(vec3(.97,.64,.52),vec3(.75,.68,1.),.5+.5*sin(a+time*.2+band.y));
  if(!wholeFracture){
   vec3 satin=vec3(dot(metal,vec3(.24,.60,.16)))*vec3(.73,.82,1.13);
   metal=mix(metal,satin,grainTone*.57);
  }
  metal*=.88+.12*grooves;
  float rim=pow(1.-clamp(dot(n,-rd),0.,1.),2.6);
  col=metal+power*rim*(1.58*edgeLight+1.32*rim*hotEdge)+pow(max(0.,dot(r,normalize(vec3(.6,.75,.3)))),32.)*vec3(1.5,1.1,.7)*(.35+2.*band.z);
 }
 return col;
}
// SHARED_TUNNEL
float auroraHeight(float x,float z){
 return (.13+.19*band.x)*sin(2.8*x+time*.27)+.24*sin(x*1.13-time*.24)+.08*cos(5.*x+z*2.)-.16+z*.32
        +.31*percussion.x*sin(2.5*x+1.95*z)+.16*percussion.y*cos(6.*x-2.4*z);
}
// An unresolved star spreads its light over a pixel even at the smaller render sizes.
vec3 skySeed(vec2 cell){
 vec3 h=fract(cell.xyx*vec3(.1031,.1030,.0973));
 h+=dot(h,h.yxz+33.33);
 return fract((h.xxy+h.yzz)*h.zyx);
}
float skyMist(vec2 p){
 vec2 i=floor(p),f=fract(p);
 f=f*f*(3.-2.*f);
 return mix(mix(skySeed(i).x,skySeed(i+vec2(1,0)).x,f.x),
            mix(skySeed(i+vec2(0,1)).x,skySeed(i+1.).x,f.x),f.y);
}
vec3 starTint(float bv){
 return mix(vec3(.76,.84,1.),vec3(1.,.77,.55),smoothstep(.05,.84,bv));
}
vec3 chartStars(vec2 p){
 vec2 xy=(size+p*size.y)*.5;
 vec2 cell=floor(xy/12.);
 if(any(lessThan(cell,vec2(0.))) || cell.x*4.>=chartSize.x || cell.y>=chartSize.y)return vec3(0.);
 vec3 color=vec3(0.);
 for(int i=0;i<4;i++){
  vec4 star=texture2D(starChart,(vec2(cell.x*4.+float(i),cell.y)+.5)/chartSize);
  if(star.b==0.)break;
  vec2 offset=12.*(fract(xy/12.)-(2.*star.rg-.5));
  float mag=8.-10.2*star.b;
  float intensity=.22*exp2(.88*(3.6-mag));
  color+=starTint(star.a)*intensity*exp(-dot(offset,offset)/1.02);
 }
 return color;
}
vec3 beacon(vec2 delta,vec3 tint,float radius,float strength){
 float r2=dot(delta,delta);
 if(r2>.012)return vec3(0.);
 float d=r2/(radius*radius);
 // A compact white core sits inside a much fainter, chromatic scattering halo.
 return strength*(vec3(1.,.98,.95)*exp(-.72*d)
        +tint*(.42*exp(-.095*d)+.07*exp(-.009*d)));
}
vec3 solarStar(vec2 delta,float pixel){
 float d=length(delta);
 if(d>.21)return vec3(0.);
 float heat=smoothstep(.12,.85,band.x);
 float radius=.020;
 vec2 q=delta/radius;
 float r=d/radius,aa=pixel/radius;
 vec2 dir=q/max(r,.001);
 float angle=atan(dir.y,dir.x+.00001);
 float surface=1.-smoothstep(1.-.5*aa,1.+.5*aa,r);
 float mu=sqrt(max(0.,1.-r*r));
 float granules=skyMist(q*3.4+vec2(time*.13,0.));
 vec3 disc=mix(vec3(2.1,.73,.20),vec3(3.9,2.8,1.70),mu*(.66+.34*granules));
 float height=max(0.,r-1.);
 // Curved streamers split as they fan out from the limb.
 float bend=angle+.12*log(1.+height)*sin(3.*angle+.22*time);
 float fan=.5+.5*cos(5.*bend+.9*sin(3.*bend-.21*time));
 float filaments=.5+.5*cos(17.*bend+1.6*sin(6.*bend+.27*time));
 float extent=.54+(1.35+.88*heat)*fan*fan;
 float corona=exp(-height/extent)*(.14+.31*fan*fan+.24*filaments*filaments);
 // One tilted plasma arch, with both footpoints hidden by the photosphere.

vec3 nightSky(vec2 p){

// Average the luminous hem across the depth interval between two folds.

vec3 aurora(vec2 p){

 float lens=smoothstep(.48,1.04,abs(side));

 ray.y-=lens*(.13+.055*sin(.59*time+2.2*side)+.065*percussion.x);

 // tangent, so the illuminated edge winds through the fabric.

 float beatHeat=smoothstep(.10,.84,percussion.y);
 float roll=.62*time+.42*percussion.x;
 float glintX=focus+.22*sin(1.15*time+.55);
 float lastHeight=0.;
 for(int i=0;i<20;i++){
  float z=float(i)/19.;
  vec2 sheet=layerPoint(ray,.72+.72*z);
  float dx=sheet.x-focus;
  float gather=exp(-8.6*dx*dx);
  float curl=5.6*dx+4.9*z-roll;
  float flare=gather*(.70+.30*beatHeat);
  float x=sheet.x*.93+.12+z*.63+.11*flare*cos(curl);
  float h=sheet.y-auroraHeight(x,z)-.14*flare*sin(curl);

  float crest=.5+.5*cos(phase);

vec3 fogLayers(vec2 p){

  for(int j=0;j<11;j++){

   float mag=max(.004,length(impact));

// Power-eight Mandelbulb. The orbit minimum supplies crevice color.

  float phi=8.*atan(z.y,z.x)+.82*percussion.y;

float tissue(vec3 p){return dot(sin(p),cos(p.zxy));}
float shellLace(vec3 p){

const float WORLD_PHASE=.0280499344; // 2 pi / 224
vec3 habitats(vec3 p){
 // Triangular weights leave broad regions of pure coral, sponge and shell.

float smoothUnionAir(float a,float b,float k){

vec2 garden(vec3 p){

  q.yz=turn(.38*sin(angle+float(i)*1.6))*q.yz;

// Move the sampled surface itself. Grid axes stay open for every route.
vec3 wallSpace(vec3 p,float depth){

            (1.-smoothstep(vec4(.055),vec4(.27),phase));

float terrain(vec3 p,bool stepping){

  float windows=1.14+.53*accents.x+.16*detail-length(folded);

  if(revision!==trackRevision||time<previousTime)reset(trackRevision);

    const elapsed=until-audioTime;
    const u0=(audioTime-previousTime)/frameDuration;
    const u1=(until-previousTime)/frameDuration;
    for(let i=0;i<average.length;i++){
     const start=mix(previousAudio[i],audio[i],u0);
     const end=mix(previousAudio[i],audio[i],u1);

     const ramp=elapsed>0?1-energyTimes[i]*states/elapsed:0;

   while(time>=leg.endTime){

   previousAudio=audio;

  let {forward,right,up}=leg;
  let position;

   const t=bendParameter(distance-leg.lineLength);

   const x=bendDerivative(1-t), y=bendDerivative(t), norm=Math.hypot(x,y);

function nextMusicAccent(groove,after){
  if(!groove){
   const step=60/RAVE_BPM;
   return Math.ceil(after/step)*step;
  }
  let previous=groove(Math.max(0,after-.025)).kick;
  for(let i=0;i<=40;i++){
   const t=after+i*.025,kick=groove(t).kick;
   if(kick>=.48 && previous<.48)return t;
   previous=kick;
  }
  return after+1.;

  const hold=tunnelTour && index%2===0?26:index===4?45:index===-1?20.57:15;
  departure=nextMusicAccent(groove,start+hold);
  end=nextMusicAccent(groove,departure+(index===4?3.5:1.9));

 function sample(time){
  if(time<start){start=0;index=first;lap=0;schedule();}
  while(time>=end){
   start=end;index=index===-1?5:index+1;
   const count=withStorm?(lap%2===0?6:5):4;
   if(index===count){index=0;lap++;}
   schedule();
  }
  sample.jaws=withStorm && lap%2===0;
  const arrival=index===4?38:11.5,span=index===4?48:16;
  const local=time<departure?arrival*(time-start)/(departure-start)
   :arrival+(span-arrival)*(time-departure)/(end-departure);
  return (index===5?112:16*index)+local;
 }

}

  const age=(performance.now()-pageStart)/1000;
  const king=choices[shownChoice];
  return {from:king.id,to:king.id,label:king.label,blend:0,arrival:4,
          age,external:king.external,rail:1.25*13.714286+2.7+age*.6};
 }
 if(sceneStart===null || time<sceneStart)sceneStart=time-(choices[shownChoice]?.court?4:0);
 const from=choices[shownChoice],to=journey?choices[journey.index]:from;
 if(journey && journey.entryTime===null)journey.entryTime=time;
 if(journey)journey.lastTime=time;
 const incomingAge=journey?Math.max(0,time-journey.entryTime):0;
 if(journey && from.jaws && to.court){
  // This interval of the original concert shader opens the teeth by their depth.
  return {from:5,to:5,arrival:4,label:from.label,external:'VÍR',
          rail:1.25*13.714286+2.3*journey.phase,age:incomingAge};
 }
 const leavingStorm=journey && from.key==='vir';
 const visible=leavingStorm?to:from;
 const external=visible.external?visible:to;
 const age=external===from?Math.max(0,time-sceneStart):incomingAge;
 return {from:visible.id,to:to.id,label:visible.label,
  blend:journey && !leavingStorm?Math.min(.9999,journey.phase):0,
  arrival:journey?4:Math.min(4,Math.max(0,(performance.now()-arrivalStart)/140)),
  age,external:external.external,jaws:external.jaws,
  rail:external.jaws?12:1.25*13.714286+(age%18)*.6};
}
async function switchScene(step=1){
 if(kingOnly || !renderFrame || step<=0)return;
 pendingSteps+=step;
 if(preparing || journey)return;
 await beginJourney();
}
async function beginJourney(){
 preparing=true;pendingSteps--;
 if(shownChoice<0){
  const label=el('sceneLabel').textContent;
  shownChoice=choices.findIndex(scene=>scene.key===(initialScene||'lasery'));
  if(shownChoice<0)shownChoice=choices.findIndex(scene=>scene.label===label);
  if(shownChoice<0)shownChoice=choices.findIndex(scene=>scene.label.includes(label.split(' / ')[0]));
  if(shownChoice<0)shownChoice=0;
 }
 const index=(shownChoice+1)%choices.length;
 const from=choices[shownChoice],to=choices[index];
 try{
  const gallery=await rendererFor('galerie');
  const storm=(from.key==='vir'||to.key==='vir')?await rendererFor('vir'):null;
  if(storm && !doorTarget)doorTarget={framebuffer:gl.createFramebuffer(),texture:gl.createTexture(),width:0,height:0};
  journey={index,gallery,storm,start:null,entryTime:null,phase:0,
           duration:from.key==='vir'?1950:from.jaws?1650:1350};
  sceneVersion++;
  el('mode').hidden=el('fracture').hidden=el('steer').hidden=true;
 }catch(error){
  pendingSteps=0;statusLine.textContent='Přechod se nepodařilo načíst. '+error.message;
 }finally{preparing=false;}
}
function drawJourney(now){
 const trip=journey,from=choices[shownChoice],to=choices[trip.index];
 if(trip.start===null)trip.start=now;
 trip.phase=Math.min(1,(now-trip.start)/trip.duration);
 if(from.key==='vir'){
  trip.gallery(now,doorTarget);
  trip.storm(now,null,doorTarget);
 }else if(to.key==='vir'){
  trip.storm(now,doorTarget);
  trip.gallery(now,null,doorTarget);
 }else trip.gallery(now);
 if(trip.phase<1)return;
 shownChoice=trip.index;
 renderFrame=to.key==='vir'?trip.storm:trip.gallery;
 sceneStart=trip.entryTime;
 if(from.jaws && to.court)sceneStart=trip.lastTime-2.3/.6;
 arrivalStart=(from.key==='vir'||from.jaws)?-Infinity:now;
 journey=null;sceneVersion++;
 el('sceneLabel').textContent=to.label;
 canvas.setAttribute('aria-label',to.label+' reagující na hudbu');
 if(pendingSteps)beginJourney();
}
window.addEventListener('keydown',event=>{
 if(kingOnly || event.key.toLowerCase()!=='c'||event.repeat||event.ctrlKey||event.altKey||event.metaKey||event.defaultPrevented)return;
 if(event.target.closest?.('input,select,textarea,[contenteditable="true"]'))return;
 event.preventDefault();
 if(projectionActive)sceneSteps++;
 else switchScene();
});
el('full').title=kingOnly?'Celá obrazovka':'Celá obrazovka · C přepíná shadery';
const openCourt=initialScene==='kral';
if(openCourt && !gl2)statusLine.textContent='Krystalový král potřebuje WebGL 2.';
if(openCourt && gl2){
 const label=choices[shownChoice].label;
 el('sceneLabel').textContent=label;
 canvas.setAttribute('aria-label',label+' reagující na hudbu');
 el('mode').hidden=el('steer').hidden=true;
}
if(!kingOnly || gl2)rendererFor(openCourt?(gl2?'galerie':'lasery'):initialScene).then(frame=>{
 renderFrame=frame;
 function draw(now){
  if(!projectionActive){
   if(journey)drawJourney(now);
   else renderFrame(now);
  }
  requestAnimationFrame(draw);
 }
 requestAnimationFrame(draw);
}).catch(e=>{statusLine.textContent='Shader se nepodařilo spustit. '+e.message;play.disabled=el('choose').disabled=true;});
</script></html>
